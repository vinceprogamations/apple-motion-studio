<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
  .g{display:grid;grid-template-columns:repeat(4,270px);grid-auto-rows:270px}
  .ramp{height:300px;background:linear-gradient(90deg,#000,#fff)}
</style></head><body>
<!-- Color-management fixture (spec § 40): flat sRGB patches (neutral, saturated, skin, brand teal) + a black→white ramp. -->
<div class="g" id="g"></div><div class="ramp"></div>
<script>
const P = [[0,0,0],[16,16,16],[64,64,64],[128,128,128],[192,192,192],[235,235,235],[255,255,255],[255,0,0],[0,255,0],[0,0,255],[255,255,0],[0,255,255],
           [255,0,255],[224,172,140],[61,217,193],[255,138,91],[77,163,255],[20,22,31],[107,79,224],[142,142,147]];
document.getElementById('g').innerHTML = P.map(c => `<div style="background:rgb(${c})"></div>`).join('');
window.PATCHES = P; window.TOTAL = 1; window.EVENTS = []; window.renderAt = t => {}; window.ready = Promise.resolve(true);
</script></body></html>
